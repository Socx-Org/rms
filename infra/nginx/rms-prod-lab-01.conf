# Real, deployed config for rms.socx.org.uk on prod-lab-01. Extends
# reference/nginx/sites/rms.conf's single-upstream template with a
# static/API split -- RMS genuinely has two logical services behind one
# vhost (a built SPA and an API), unlike the reference template's simpler
# single-process assumption. No path rewriting anywhere (both proxy_pass
# targets omit a trailing URI component, so the full request path passes
# through unchanged) -- CS-INF-010 recorded a real outage caused by nginx
# stripping /api/ before proxying; this preserves the reference template's
# explicit rule while still splitting traffic (#14).

server {
    listen 80;
    listen [::]:80;
    server_name rms.socx.org.uk;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rms.socx.org.uk;

    ssl_certificate     /etc/letsencrypt/live/rms.socx.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rms.socx.org.uk/privkey.pem;
    include /etc/nginx/snippets/tls-baseline.conf;

    access_log /var/log/nginx/rms-access.log;
    error_log  /var/log/nginx/rms-error.log;
    add_header X-SOCX-Environment production always;

    # API (includes /api/health) and the liveness endpoint -- proxied to
    # the Node process, full path preserved.
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }

    # React SPA -- static build, synced to /var/www/rms by deploy.yml
    # (not served from /opt/rms/current: that directory is 750 rms:rms,
    # reference/systemd's hardening, unreadable to nginx/www-data).
    location / {
        root /var/www/rms;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
