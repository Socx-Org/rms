name: Deploy rms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rms
  cancel-in-progress: true


jobs:

  # ── API integration tests (Node / Jest) ────────────────────────────────────
  # Runs on every push to main and every PR targeting main. Node/Python
  # versions match prod-lab-01's real, actual runtime (Ubuntu 26.04 LTS ships
  # Node 24/Python 3.14 -- no Node 20/Python 3.12 available there), verified
  # for real: 356/356 Jest and 55/55 pytest pass under these exact versions
  # (2026-08-08).
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB:       ${{ secrets.CI_DB_NAME }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      JWT_SECRET:   ${{ secrets.CI_JWT_SECRET }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies (worker)
        run: pip install -r apps/worker/requirements.txt

      - name: Apply database schema
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          CI_DB_USER: ${{ secrets.CI_DB_USER }}
          CI_DB_NAME: ${{ secrets.CI_DB_NAME }}
        run: |
          psql -h localhost -U "$CI_DB_USER" -d "$CI_DB_NAME" -f infra/rms_001_initial_schema.sql
          psql -h localhost -U "$CI_DB_USER" -d "$CI_DB_NAME" -f infra/rms_002_email_outbox.sql
          psql -h localhost -U "$CI_DB_USER" -d "$CI_DB_NAME" -f infra/rms_003_revoked_tokens.sql
          psql -h localhost -U "$CI_DB_USER" -d "$CI_DB_NAME" -f infra/rms_004_dispatch_retry_after.sql
          psql -h localhost -U "$CI_DB_USER" -d "$CI_DB_NAME" -f infra/rms_005_super_admin_audit.sql
          psql -h localhost -U "$CI_DB_USER" -d "$CI_DB_NAME" -c "UPDATE system_settings SET value = 'true' WHERE key = 'allow_public_registration';"

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma

      - name: Run API tests
        run: npm test --workspace=apps/api

  # ── Python worker unit tests ──────────────────────────────────────────────
  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/worker/requirements.txt pytest

      - name: Run worker tests
        working-directory: apps/worker
        run: pytest -q tests/

  # ── Deploy to prod-lab-01 (reference/deployment, ADR-040/ADR-150/OPS-030) ──
  # Rewritten 2026-08-08 (#12) around reference/deployment's deploy-release.sh
  # -- versioned release, health-gated restart, automatic rollback on
  # failure -- replacing the old on-host `npm ci`/in-place-restart mechanism
  # (which targeted a different, now-defunct environment) and the dead
  # do-nginx-infra reference (superseded by reference/nginx, already live).
  #
  # Node is built here, not on the droplet, deliberately -- this runner is
  # Linux (matching prod-lab-01), so native addons (bcrypt, Prisma's query
  # engine) come out correctly built for the deploy target. Building the
  # release locally on a different OS/arch and shipping node_modules doesn't
  # work (hit this for real during #11's manual first deploy: a macOS-built
  # bcrypt binding failed on the droplet with "invalid ELF header").
  #
  # The Python worker isn't covered by deploy-release.sh's atomicity --
  # that script is Node-oriented and knows nothing about venvs. The worker's
  # venv lives in APP_DIR/shared (persistent across releases; venvs aren't
  # relocatable, so baking one into a versioned release directory doesn't
  # work either) and is updated as a step before the release swap, using the
  # new commit's requirements.txt. A known, documented limitation: if the
  # venv update step fails, the deploy step aborts before deploy-release.sh
  # runs, so a bad requirements.txt can't ship -- but once deploy-release.sh
  # restarts rms-worker.service as part of its own health-gated swap, a
  # worker-specific runtime failure doesn't trigger its rollback path the
  # same principled way an API health-check failure does.
  deploy:
    name: Deploy
    needs: [api-tests, worker-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod-lab-01

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so `git describe --tags` can see tags

      - name: Compute release version
        id: version
        run: |
          if git describe --tags --exact-match >/dev/null 2>&1; then
            VERSION="$(git describe --tags --exact-match)"
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "Deploying version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Full install (postinstall runs `prisma generate`, needed before
      # pruning removes the `prisma` CLI devDependency).
      - name: Install dependencies
        run: npm ci

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Package release
        run: |
          tar -czf release.tar.gz \
            apps/api apps/worker packages/db \
            node_modules package.json package-lock.json

      - name: Deploy to droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_OPTS="-i $KEY_FILE -o StrictHostKeyChecking=accept-new"
          REMOTE="${DEPLOY_USER}@${DROPLET_HOST}"
          REMOTE_TARBALL="/tmp/release-${VERSION}.tar.gz"
          REMOTE_REQUIREMENTS="/tmp/requirements-${VERSION}.txt"

          # Worker venv first, using the new commit's requirements.txt, so a
          # bad dependency change fails here -- before the release ships.
          scp $SSH_OPTS apps/worker/requirements.txt "${REMOTE}:${REMOTE_REQUIREMENTS}"
          ssh $SSH_OPTS "$REMOTE" \
            "sudo -u rms env HOME=/opt/rms/shared/npm-home /opt/rms/shared/venv/bin/pip install --quiet -r '${REMOTE_REQUIREMENTS}' && rm -f '${REMOTE_REQUIREMENTS}'"

          scp $SSH_OPTS release.tar.gz "${REMOTE}:${REMOTE_TARBALL}"
          ssh $SSH_OPTS "$REMOTE" \
            "sudo SERVICES='rms-api.service rms-worker.service' HEALTH_URL='http://127.0.0.1:3002/' /opt/deploy/scripts/deploy-release.sh rms '${VERSION}' '${REMOTE_TARBALL}'"
          ssh $SSH_OPTS "$REMOTE" "rm -f '${REMOTE_TARBALL}'"
